name = "control-kit"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-10-22"

[secrets]
required = ["ONSHAPE_OAUTH_CLIENT_ID", "ONSHAPE_OAUTH_CLIENT_SECRET", "SESSION_ENCRYPTION_KEY"]
# Optional secrets, not in `required` so a deploy without them still works (each feature stays off until set):
# CONTROL_KIT_CLIENT_SECRET (Control Point linking, docs/control-point-link.md), GEMINI_API_KEY and ANTHROPIC_API_KEY (AI review).

[vars]
ONSHAPE_API_BASE = "https://cad.onshape.com"
ONSHAPE_API_VERSION = "v9"
ONSHAPE_OAUTH_BASE = "https://oauth.onshape.com"
WEB_ORIGIN = "https://control-kit.pages.dev"
ONSHAPE_OAUTH_REDIRECT_URI = "https://control-kit.control-kit-worker.workers.dev/oauth/redirect"
VENDOR_STALE_HOURS = "336"
SCAN_TARGET_MS = "10000"
CONTROL_POINT_ORIGIN = "https://tryctrlpoint.org"

[[kv_namespaces]]
binding = "VENDOR_CATALOG"
id = "f04685dda4a64f8093960649885513d6"

[[kv_namespaces]]
binding = "APP_STATE"
id = "c3ef1ad4a11a47f1899c2b63e7a0c3b6"

# The AI review's daily allowance: one Durable Object, so reserving is atomic (free plan: SQLite-backed classes).
[[durable_objects.bindings]]
name = "AI_ALLOWANCE"
class_name = "AiAllowance"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiAllowance"]

[triggers]
# Vendor crawls are paused at the owner's request (2026-10-25): they used most of the free plan's daily KV writes,
# and the published catalogs stay as they are; they are refreshed by hand with scripts/catalog-load.ts. To resume a
# crawl, add its hourly cron from `cronVendors`: "0 * * * *" goBILDA, "12 * * * *" ServoCity, "24 * * * *" AndyMark,
# "48 * * * *" Pitsco.
# REV is never crawled. "*/10 * * * *" reads REV's official feed (apps/worker/src/rev-feed.ts): a download at most every
# six hours, then one small step per run to stage and publish it within the free plan's 10 ms of CPU. A run with nothing
# to do writes nothing to KV.
crons = ["*/10 * * * *"]

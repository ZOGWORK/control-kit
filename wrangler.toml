name = "control-kit-worker"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-10-22"

[vars]
ONSHAPE_API_BASE = "https://cad.onshape.com"
ONSHAPE_OAUTH_BASE = "https://oauth.onshape.com"
WEB_ORIGIN = "http://localhost:5173"
VENDOR_STALE_HOURS = "24"
SCAN_TARGET_MS = "10000"

[[kv_namespaces]]
binding = "VENDOR_CATALOG"
id = "REPLACE_WITH_VENDOR_CATALOG_KV_ID"

[[kv_namespaces]]
binding = "APP_STATE"
id = "REPLACE_WITH_APP_STATE_KV_ID"

[triggers]
crons = ["0 */6 * * *", "12 */6 * * *", "24 */6 * * *", "36 */6 * * *", "48 */6 * * *"]

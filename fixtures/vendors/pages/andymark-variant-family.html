      "description": "The NeveRest Orbital gearmotor is a robust planetary gearmotor designed for FTC. \n\u003c!-- more --\u003e\n\u003cul class=\"tabs\"\u003e\n\t\u003cli\u003eDescription\u003c\/li\u003e\n\t\u003cli id=\"specstab\"\u003eSpecifications\u003c\/li\u003e\n\t\u003cli id=\"docstab\" style=\"display:none\"\u003eDocumentation\u003c\/li\u003e\n\u003c\/ul\u003e\n\u003cul class=\"tabs-content\"\u003e\n\t\u003cli class=\"active\"\u003e\n\t\t\u003c!-- Description --\u003e\n\t\t\u003cp\u003eWith many ratios to choose from you can find the right motor for you, from a fast spinning intake to a high reduction arm, all are possible with NeveRest Orbitals. They have a pre-installed encoder and an output shaft directly in the center of the output face. The shaft is a 6 mm D and the gearbox housing is 37 mm in diameter.\u003c\/p\u003e\n\u003cp\u003eThe power cable which feeds into the black encoder housing has two different options that are already crimped to the end of the cable. \u003c\/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cstrong\u003eJST-VH-2 connectors\u003c\/strong\u003e: this option plugs directly into the \u003cem\u003eFIRST\u003c\/em\u003e Tech Challenge REV Controller\u003c\/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eAnderson Powerpole 15A connectors: \u003c\/strong\u003eThis is another popular connector with FTC and FRC teams.\u003c\/li\u003e\n\u003c\/ol\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cem\u003eFIRST\u003c\/em\u003e Legality:\u003c\/strong\u003e\u003c\/p\u003e\n\u003cul\u003e\n\u003cli\u003eAccording to the FIRST Tech Challenge Game Manual, all versions of the NeveRest motor are legal in FTC.\u003c\/li\u003e\n\u003cli\u003eAccording to the FIRST Robotics Competition Game Manual, all versions of the NeveRest motor are legal in FRC as it uses the NeveRest am-3104 motor.\u003c\/li\u003e\n\u003c\/ul\u003e\n\u003cp\u003e\u003cstrong\u003eUsage:\u003c\/strong\u003e\u003c\/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003ca href=\"\/products\/picobox-leo\"\u003ePicoBox LEO (am-3614)\u003c\/a\u003e. This gearbox is used for creating chain drives for mechanisms like arms.\u003c\/li\u003e\n\u003cli\u003e\n\u003ca href=\"\/products\/picobox-geo\"\u003ePicoBox GEO (am-3616)\u003c\/a\u003e. This gearbox combines two NeveRest Orbital motors into a single output shaft allowing for combined power at a low ratio.\u003c\/li\u003e\n\u003cli\u003e\n\u003ca href=\"\/products\/picobox-meo\"\u003ePicoBox MEO (am-3615)\u003c\/a\u003e. This gearbox accepts one NeveRest motor and allows for gear changing through PicoBox gearing.\u003c\/li\u003e\n\u003c\/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEncoder:\u003c\/strong\u003e\u003cbr\u003eThere is an encoder mounted to the backside of this motor. It is a 7 pulse per revolution (PPR), hall effect encoder. Multiply the ratio by 7 to get the PPR of the output shaft. For example the NeverRest 3.7 output shaft provides 25.9 PPR.\u003c\/p\u003e\n\u003cp\u003e\u003cstrong\u003eEncoder Cable Options:\u003c\/strong\u003e\u003cbr\u003eNeveRest motors do not come with an encoder cable as we offer 3 cable options:\u003c\/p\u003e\n\u003cdiv\u003e\n\u003cstrong\u003e\u003ca href=\"\/am-3926a\"\u003eam-3926a\u003c\/a\u003e\u003c\/strong\u003e allows you to connect the encoder directly to the \u003cem\u003eFIRST\u003c\/em\u003e Tech Challenge REV Controller.\u003c\/div\u003e\n\u003cp\u003e\u003cstrong\u003e\u003ca href=\"\/am-2992\"\u003eam-2992\u003c\/a\u003e \u003c\/strong\u003ehas the 4 encoder pins joined in one housing using standard 0.1 in. spacing.\u003c\/p\u003e\n\u003cdiv\u003e\n\u003cstrong\u003e\u003ca href=\"\/product-p\/am-2993.htm\"\u003eam-2993\u003c\/a\u003e\u003c\/strong\u003e allows you to break out the 4 pins separately if you need them in a different order.\u003cbr\u003e\u003cstrong\u003e\u003cbr\u003e\u003c\/strong\u003e\n\u003c\/div\u003e\n\u003cdiv\u003eIf you need the output shaft to be a 1\/2 in. Hex, check out the \u003ca href=\"\/products\/6-mm-d-shaft-to-0-5-in-hex-adapter\"\u003e6 mm D to 0.5 in. Hex-Shaft Adapter (am-3744a)\u003c\/a\u003e\n\u003c\/div\u003e\n\t\u003c\/li\u003e\n\t\u003cli\u003e\n\t\t\u003c!-- Specifications --\u003e\n\t\t\u003cul\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eConnector Type:\u003c\/b\u003e JST-VH-2, Anderson Powerpoles\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eGauge:\u003c\/b\u003e 18 AWG\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eMaterial:\u003c\/b\u003e Steel and Plastic\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eMaximum Diameter:\u003c\/b\u003e 1.5 in. [38 mm]\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eMaximum Power:\u003c\/b\u003e 14 W\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eMounting Geometry:\u003c\/b\u003e 4x M3 x 0.5 on a 28 mm Bolt Circle\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eOutput Shaft Size:\u003c\/b\u003e 0.240 in. [6 mm] D Shaft\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003ePoles Per Magnet:\u003c\/b\u003e 7\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eStall Current:\u003c\/b\u003e 11 A\u003c\/li\u003e\n\t\t\t\u003cli\u003e\n\u003cb\u003eVoltage:\u003c\/b\u003e 12 VDC\u003c\/li\u003e\n\t\t\u003c\/ul\u003e\n\t\u003c\/li\u003e\n\t\u003cli\u003e\n\t\t\u003c!-- Documentation --\u003e\n\t\u003c\/li\u003e\n\u003c\/ul\u003e\n",

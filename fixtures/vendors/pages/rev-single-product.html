        "description": "The UltraPlanetary Gearbox Kit comes with UltraPlanetary Cartridges to support six different final gear reductions ranging from nominally 3:1 to 60:1 allowing for the right amount of torque for the application at hand. The kit has a pinion already pressed onto the motor and pre-assembled cartridges for teams to begin testing and iterating on their design.\nThe UltraPlanetary System is a cartridge based modular gearbox designed to handle the rigors of the competition and the classroom. The UltraPlanetary System includes an input stage and pinion gear that works the HD Hex Motor and other 550 class motors. Building on the ability to iterate and adjust designs easily using the DUO Build System, the UltraPlanetary System consists of pre-assembled and lubricated cartridges allowing for swapping gear ratios on the fly and with ease. Users can configure a single-stage planetary using one of three different reduction cartridges, build multi-stage gearboxes through stacking individual cartridges together, and choose two different ways for transferring power: either through face mounting directly on the output stage or choosing the length of 5mm hex shaft best suited for the application.\nThe UltraPlanetary System offers a variety of mounting options, with four different brackets available for attachment to DUO 15mm Extrusion, C Channel, or U Channel. It is designed for use with the HD Hex Motor (REV-41-1291), NEO 550 Brushless Motor (REV-21-1651), and other 550 series motors that feature compatible shafts and mounting patterns. The UltraPlanetary 550 Motor Pinion Gear (REV-41-1608) included in this kit is pressed onto the HD Hex Motor, and additional pinion gears can be purchased from the 550 Motor Pinion product page.\nGearbox Specifications\n\nModule: 0.55\nPressure Angle:&nbsp;20&deg;\nMaterials:&nbsp;Sintered Steel, Glass Fiber Reinforced PA66 Nylon\nWeight(s):\n\nUltraPlanetary w\u002f3 Cartridges and HD Hex Motor, no hardware: 441.5g (0.973lbs)\
